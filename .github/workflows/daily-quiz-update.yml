name: Daily AI Online Quiz Improvement

on:
  schedule:
    # Runs daily at 5:00 PM Philippines time (09:00 UTC)
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ai-online-quiz
  cancel-in-progress: false

jobs:
  improve-online-quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Prepare AI update branch
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          if git ls-remote --exit-code --heads origin ai-daily-updates >/dev/null 2>&1; then
            git fetch origin ai-daily-updates
            git checkout -B ai-daily-updates origin/ai-daily-updates
          else
            git checkout -B ai-daily-updates origin/main
          fi

      - name: Generate and apply AI improvement
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/daily-ai.mjs <<'JS'
          import fs from "node:fs";
          import { execFileSync, spawnSync } from "node:child_process";

          const apiKey = process.env.GEMINI_API_KEY;

          if (!apiKey) {
            throw new Error(
              "GEMINI_API_KEY is missing. Add it under Settings > Secrets and variables > Actions."
            );
          }

          function git(args, options = {}) {
            const result = spawnSync("git", args, {
              encoding: "utf8",
              ...options
            });

            if (result.status !== 0) {
              throw new Error(
                `git ${args.join(" ")} failed:\n${result.stderr || result.stdout}`
              );
            }

            return result.stdout || "";
          }

          const trackedFiles = git(["ls-files", "-z"])
            .split("\0")
            .filter(Boolean);

          const allowedExtensions =
            /\.(?:js|jsx|ts|tsx|css|scss|html|md)$/i;

          const excludedPath =
            /(^|\/)(?:node_modules|dist|build|coverage|\.git|\.next|out|vendor)(\/|$)/i;

          const excludedFile =
            /(?:^|\/)(?:package(?:-lock)?\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|bun\.lockb?|\.env(?:\..*)?|[^/]*\.min\.(?:js|css))$/i;

          const sourceFiles = trackedFiles.filter(file =>
            allowedExtensions.test(file) &&
            !excludedPath.test(file) &&
            !excludedFile.test(file) &&
            !file.startsWith(".github/")
          );

          if (sourceFiles.length === 0) {
            throw new Error(
              "No tracked source files were found on ai-daily-updates."
            );
          }

          const chunks = [];
          let totalChars = 0;
          const maxChars = 30000;

          for (const file of sourceFiles) {
            const content = fs.readFileSync(file, "utf8");

            if (content.includes("\0")) continue;

            const chunk = `\n\n--- FILE: ${file} ---\n${content}`;
            if (totalChars + chunk.length > maxChars) continue;

            chunks.push(chunk);
            totalChars += chunk.length;
          }

          const prompt = `
          You are improving an existing React + TypeScript online quiz application.

          Review the supplied source files and propose ONE small, useful, low-risk
          improvement to the quiz.

          Good improvements include:
          - Clearer quiz question and answer presentation.
          - Better answer-selection feedback.
          - Accurate score display and result feedback.
          - Better quiz navigation or progress indicators.
          - Responsive layout or accessibility improvements.
          - Fixing a clear, small bug.

          Rules:
          - Preserve the existing framework, architecture, and visual style.
          - Follow the project's existing coding conventions.
          - Do not add dependencies or change package files or lockfiles.
          - Do not change secrets, environment configuration, deployment settings,
            GitHub Actions workflows, or authentication/security behavior.
          - Do not reveal correct answers before the quiz's intended reveal point.
          - Do not fabricate APIs, data, or existing features.
          - Do not rewrite unrelated files.
          - Modify only existing source files supplied below.
          - Keep the change small and focused.
          - If no safe, worthwhile improvement is possible, return exactly:
            NO_CHANGE

          Otherwise, return ONLY a valid unified Git diff.
          Include standard --- a/path and +++ b/path headers.
          Do not use Markdown fences or explanatory text.

          SOURCE FILES:
          ${chunks.join("")}
          `;

          async function listAvailableModels() {
            const response = await fetch(
              "https://generativelanguage.googleapis.com/v1beta/models",
              {
                headers: {
                  "x-goog-api-key": apiKey
                }
              }
            );

            const data = await response.json();

            if (!response.ok) {
              throw new Error(
                `Gemini model-list request failed: HTTP ${response.status}: ${
                  data.error?.message || JSON.stringify(data)
                }`
              );
            }

            return (data.models || [])
              .filter(model =>
                (model.supportedGenerationMethods || [])
                  .includes("generateContent")
              )
              .map(model => model.name.replace(/^models\//, ""));
          }

          async function generate(model) {
            const response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "x-goog-api-key": apiKey
                },
                body: JSON.stringify({
                  contents: [
                    {
                      role: "user",
                      parts: [{ text: prompt }]
                    }
                  ],
                  generationConfig: {
                    maxOutputTokens: 6000
                  }
                })
              }
            );

            const data = await response.json();

            if (!response.ok) {
              throw new Error(
                `HTTP ${response.status}: ${
                  data.error?.message || JSON.stringify(data)
                }`
              );
            }

            const text = (data.candidates?.[0]?.content?.parts || [])
              .map(part => part.text || "")
              .join("")
              .trim();

            if (!text) {
              throw new Error(
                "Gemini returned no text. The response may have been blocked or truncated."
              );
            }

            return text;
          }

          const availableModels = await listAvailableModels();

          // Prefer the model recommended by the current API error.
          // If it is unavailable to this key, choose another listed Flash model.
          const preferredModels = [
            "gemini-3.8-flash",
            "gemini-3.7-flash",
            "gemini-3.6-flash",
            "gemini-3-flash"
          ];

          const model = [
            ...preferredModels.filter(name => availableModels.includes(name)),
            ...availableModels
              .filter(name =>
                /flash/i.test(name) &&
                !preferredModels.includes(name)
              )
              .sort()
          ][0];

          if (!model) {
            throw new Error(
              "No available Flash model supporting generateContent was found for this API key. Check the Gemini API models list and your API access."
            );
          }

          console.log(`Using available Gemini model: ${model}`);

          const generated = await generate(model);

          if (generated === "NO_CHANGE") {
            console.log("AI found no safe improvement. Nothing to commit.");
            process.exit(0);
          }

          const patch = generated
            .replace(/^```(?:diff)?\s*/i, "")
            .replace(/\s*```$/, "")
            .trim();

          if (!patch.startsWith("--- a/") ||
              !patch.includes("\n+++ b/")) {
            throw new Error(
              "Gemini did not return a valid unified diff. No changes applied."
            );
          }

          const allowedFiles = new Set(sourceFiles);
          const diffHeaders = patch.split("\n").filter(line =>
            line.startsWith("diff --git ")
          );

          if (diffHeaders.length === 0) {
            throw new Error("The generated diff contains no file changes.");
          }

          for (const line of patch.split("\n")) {
            if (line.startsWith("--- ") || line.startsWith("+++ ")) {
              const match = line.match(/^(?:---|\+\+\+) ([^\t ]+)/);
              if (!match) {
                throw new Error("Invalid file header in generated diff.");
              }

              const file = match[1];

              if (file === "/dev/null") {
                throw new Error(
                  "New files and deleted files are not allowed."
                );
              }

              const path = file.slice(2);

              if (!allowedFiles.has(path)) {
                throw new Error(
                  `AI attempted to change an unapproved file: ${path}`
                );
              }

              if (
                path.startsWith("/") ||
                path.split("/").includes("..") ||
                path.startsWith(".github/")
              ) {
                throw new Error(`Unsafe file path: ${path}`);
              }
            }
          }

          const patchPath = "/tmp/ai-improvement.patch";
          fs.writeFileSync(patchPath, patch + "\n");

          const check = spawnSync(
            "git",
            ["apply", "--check", patchPath],
            { encoding: "utf8" }
          );

          if (check.status !== 0) {
            throw new Error(
              `Generated patch failed validation:\n${check.stderr || check.stdout}`
            );
          }

          git(["apply", patchPath]);

          const changedFiles = git([
            "diff",
            "--name-only"
          ])
            .split("\n")
            .filter(Boolean);

          if (changedFiles.length === 0) {
            console.log("Patch made no changes.");
            process.exit(0);
          }

          for (const file of changedFiles) {
            if (!allowedFiles.has(file)) {
              throw new Error(
                `Unexpected changed file detected: ${file}`
              );
            }
          }

          console.log("AI improvement applied to:");
          for (const file of changedFiles) console.log(`- ${file}`);
          JS

          node /tmp/daily-ai.mjs

      - name: Install dependencies and validate project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f package.json ]; then
            echo "No package.json found at repository root."
            exit 1
          fi

          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            echo "No npm lockfile found; using npm install."
            npm install
          fi

          node --input-type=module <<'JS'
          import fs from "node:fs";

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const scripts = pkg.scripts || {};

          if (scripts.test) {
            const testScript = scripts.test;

            let args = ["test"];

            if (/vitest/.test(testScript)) {
              args.push("--", "--run");
            } else if (/react-scripts/.test(testScript)) {
              args.push("--", "--watchAll=false");
            }

            const { spawnSync } = await import("node:child_process");
            const result = spawnSync("npm", args, {
              stdio: "inherit",
              env: {
                ...process.env,
                CI: "true"
              }
            });

            if (result.status !== 0) {
              process.exit(result.status ?? 1);
            }
          } else {
            console.log("No test script defined; skipping tests.");
          }

          if (scripts.build) {
            const { spawnSync } = await import("node:child_process");
            const result = spawnSync("npm", ["run", "build"], {
              stdio: "inherit",
              env: process.env
            });

            if (result.status !== 0) {
              process.exit(result.status ?? 1);
            }
          } else {
            console.log("No build script defined; skipping build.");
          }
          JS

      - name: Commit and push improvement
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git add -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.css' '*.scss' '*.html' '*.md'
          git diff --cached --quiet && {
            echo "No eligible source changes to commit."
            exit 0
          }

          git commit -m "chore: daily AI online quiz improvement"
          git push origin HEAD:ai-daily-updates
